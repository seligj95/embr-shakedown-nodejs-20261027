name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Restore dependencies
        run: npm ci --ignore-scripts
      - name: Check syntax
        run: node --check server.mjs && node --check server.test.mjs
      - name: Run provider-mocked HTTP tests
        run: npm test
